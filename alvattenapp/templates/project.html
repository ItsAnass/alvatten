{% extends "base.html" %}
{% load static %}

{% block title %}Projekt{% endblock %}

<body>


    {% block content %}
    <!-- Hero Start -->
    <div class="container-fluid pb-2 hero-header bg-light mb-5">
        <div class="container py-5">
            <div class="row g-3 align-items-center">
                <div class="col-lg-6 text-center text-lg-start">
                    <h1 class="display-1 mb-0 animated slideInLeft">Projekt</h1>
                </div>
            </div>
        </div>
    </div>
    <!-- Hero End -->

    <!-- Project Start -->
    <div class="container-fluid py-5">
        <div class="container py-5">
            <div class="row g-0">
                <div class="col-lg-5 wow fadeIn" data-wow-delay="0.1s">
                    <div class="d-flex flex-column justify-content-center bg-primary h-100 p-5">
            <h1 class="text-white mb-5">Våra senaste <span
                class="text-uppercase text-primary bg-light px-2">projekt</span></h1>
            <h4 class="text-white mb-0"><span class="display-1">6</span> av våra senaste projekt</h4>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="row g-0" id="project-gallery">
                        <div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay="0.2s">
                            <div class="project-item position-relative overflow-hidden">
                                <img class="img-fluid w-100" src="{% static 'img/project-1.jpg' %}" alt="">
                                    <div class="d-none project-images" data-images="{% static 'img/project-1.jpg' %},{% static 'img/project-2.jpg' %},{% static 'img/project-3.jpg' %}"></div>
                                <a class="project-overlay text-decoration-none" href="#">
                                    <h4 class="text-white">Kök</h4>
                                   
                                </a>
                            </div>
                        </div>
                        <div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay="0.3s">
                            <div class="project-item position-relative overflow-hidden">
                                <img class="img-fluid w-100" src="{% static 'img/project-2.jpg' %}" alt="">
                                    <div class="d-none project-images" data-images="{% static 'img/project-2.jpg' %},{% static 'img/project-4.jpg' %},{% static 'img/project-5.jpg' %}"></div>
                                <a class="project-overlay text-decoration-none" href="#">
                                    <h4 class="text-white">Badrum</h4>
                                    
                                </a>
                            </div>
                        </div>
                        <div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay="0.4s">
                            <div class="project-item position-relative overflow-hidden">
                                <img class="img-fluid w-100" src="{% static 'img/project-3.jpg' %}" alt="">
                                    <div class="d-none project-images" data-images="{% static 'img/project-3.jpg' %},{% static 'img/project-6.jpg' %},{% static 'img/project-1.jpg' %}"></div>
                                <a class="project-overlay text-decoration-none" href="#">
                                    <h4 class="text-white">Sovrum</h4>
                                   
                                </a>
                            </div>
                        </div>
                        <div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay="0.5s">
                            <div class="project-item position-relative overflow-hidden">
                                <img class="img-fluid w-100" src="{% static 'img/project-4.jpg' %}" alt="">
                                    <div class="d-none project-images" data-images="{% static 'img/project-4.jpg' %},{% static 'img/project-2.jpg' %},{% static 'img/project-5.jpg' %}"></div>
                                <a class="project-overlay text-decoration-none" href="#">
                                    <h4 class="text-white">Vardagsrum</h4>
                                    
                                </a>
                            </div>
                        </div>
                        <div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay="0.6s">
                            <div class="project-item position-relative overflow-hidden">
                                <img class="img-fluid w-100" src="{% static 'img/project-5.jpg' %}" alt="">
                                    <div class="d-none project-images" data-images="{% static 'img/project-5.jpg' %},{% static 'img/project-3.jpg' %},{% static 'img/project-6.jpg' %}"></div>
                                <a class="project-overlay text-decoration-none" href="#">
                                    <h4 class="text-white">Möbler</h4>
                                    
                                </a>
                            </div>
                        </div>
                        <div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay="0.7s">
                            <div class="project-item position-relative overflow-hidden">
                                <img class="img-fluid w-100" src="{% static 'img/project-6.jpg' %}" alt="">
                                    <div class="d-none project-images" data-images="{% static 'img/project-6.jpg' %},{% static 'img/project-1.jpg' %},{% static 'img/project-4.jpg' %}"></div>
                                <a class="project-overlay text-decoration-none" href="#">
                                    <h4 class="text-white">Renovering</h4>
                                    
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Project End -->

        <!-- Modal Gallery (Bootstrap 5) -->
        <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-centered">
                <div class="modal-content" style="background:#d9dcd6;">
                    <div class="modal-header">
                        <h5 class="modal-title" id="projectModalLabel">Projektgalleri</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Stäng"></button>
                    </div>
                    <div class="modal-body">
                        <div id="modalGalleryCarousel" class="carousel slide" data-bs-ride="carousel">
                            <div class="carousel-indicators" id="modal-gallery-indicators"></div>
                            <div class="carousel-inner" id="modal-gallery-inner">
                                <!-- Images will be injected here -->
                            </div>
                            <button class="carousel-control-prev" type="button" data-bs-target="#modalGalleryCarousel" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Föregående</span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#modalGalleryCarousel" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Nästa</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    {% endblock %}

</body>
